<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">{{ mode() === 'add' ? 'Add' : 'Edit' }}</h2>
      <button class="btn-close" (click)="onClose()" [disabled]="isSaving()">&times;</button>
    </div>

    <div class="modal-body">
      @if (mode() === 'edit' && item()) {
        <div class="form-group readonly-group">
          <label class="form-label">Id</label>
          <span class="readonly-value">{{ item()?.id }}</span>
        </div>
      }

      <div class="form-group">
        <label class="form-label" for="category-name">Name</label>
        <input
          id="category-name"
          type="text"
          class="form-input"
          [class.error]="nameError()"
          [ngModel]="name()"
          (ngModelChange)="onNameChange($event)"
          [readonly]="!canEdit()"
          [disabled]="isSaving()"
        />
        @if (nameError()) {
          <span class="error-text">{{ nameError() }}</span>
        }
      </div>

      @if (serverError()) {
        <div class="server-error">{{ serverError() }}</div>
      }
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onClose()" [disabled]="isSaving()">Close</button>
      @if (canEdit()) {
        <button class="btn-primary" (click)="onSave()" [disabled]="isSaving() || !!nameError()">
          {{ isSaving() ? 'Saving...' : 'Save' }}
        </button>
      }
    </div>
  </div>
</div>
